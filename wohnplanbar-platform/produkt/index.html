<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Produkt · WohnPlanbar</title><meta name="robots" content="noindex,follow"><style>
:root{--bg:#f5f0e7;--card:#fffdf9;--text:#241b15;--muted:#74675e;--line:rgba(62,43,31,.13);--green:#4e6b59;--dark:#263e32;--soft:#e2ebe3;--shadow:0 24px 70px rgba(63,43,28,.10)}
*{box-sizing:border-box}html{overflow-x:clip}body{margin:0;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--text);background:linear-gradient(180deg,#fbf8f2,var(--bg))}
a{color:inherit}.wrap{max-width:1180px;margin:auto;padding:0 28px 56px}.header{margin-top:12px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:rgba(255,253,249,.88);border-radius:18px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:850}.mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,var(--dark),#617b67);color:#fff;font-family:Georgia,serif}.back{text-decoration:none;font-size:13px;font-weight:800;color:var(--muted)}
.crumb{padding:24px 0;color:var(--muted);font-size:12px}.crumb a{text-decoration:none;font-weight:800}.product{display:grid;grid-template-columns:minmax(320px,.9fr) minmax(0,1.1fr);gap:42px;align-items:start}.media{aspect-ratio:1/1;border-radius:30px;overflow:hidden;background:linear-gradient(145deg,#e7eee8,#fff8ed);box-shadow:var(--shadow);display:grid;place-items:center}.media img{width:100%;height:100%;object-fit:contain;display:block}.placeholder{text-align:center;padding:36px;color:var(--muted)}.placeholder b{display:grid;place-items:center;width:78px;height:78px;margin:0 auto 18px;border-radius:24px;background:#fff;color:var(--dark);font-family:Georgia,serif;font-size:34px}.eyebrow{display:inline-flex;padding:8px 11px;border-radius:999px;background:var(--soft);color:var(--dark);font-size:12px;font-weight:850}.copy h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(42px,6vw,70px);font-weight:500;letter-spacing:-.045em;line-height:.98;margin:16px 0 12px}.brandline{color:var(--muted);font-weight:750}.intro{color:var(--muted);font-size:17px;line-height:1.65}.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;margin-top:20px;box-shadow:0 14px 38px rgba(63,43,28,.05)}.panel h2{font-family:Georgia,serif;font-weight:500;font-size:28px;margin:0 0 14px}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.fact{padding:12px;border:1px solid var(--line);border-radius:14px;background:#fbfaf7}.fact b{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.fact span{font-size:14px;font-weight:800}.offers{display:grid;gap:10px}.offer{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:16px}.offer small{display:block;color:var(--muted);margin-top:3px}.price{font-weight:900}.offer a{padding:11px 13px;border-radius:12px;background:var(--dark);color:#fff;text-decoration:none;font-weight:850;font-size:13px}.empty{padding:16px;border-radius:16px;background:#f4f6f3;color:var(--muted);line-height:1.55;font-size:13px}.notice{font-size:11px;color:var(--muted);line-height:1.5;margin-top:12px}.notfound{text-align:center;padding:80px 20px}.notfound h1{font-family:Georgia,serif;font-size:46px;font-weight:500}
@media(max-width:760px){.wrap{padding:0 16px 42px}.product{grid-template-columns:1fr;gap:24px}.media{aspect-ratio:4/3}.facts{grid-template-columns:1fr}.offer{grid-template-columns:1fr auto}.offer a{grid-column:1/-1;text-align:center}.copy h1{font-size:46px}}
</style></head><body><div class="wrap"><header class="header"><a class="brand" href="../index.html"><span class="mark">W</span>WohnPlanbar</a><a class="back" href="javascript:history.back()">← Zurück</a></header><div id="app"></div></div>
<script src="../data/products.js"></script><script src="../data/partners.js"></script><script src="../assets/product-data.js"></script><script>
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const id=new URLSearchParams(location.search).get("id");
const p=(window.WohnPlanbarData?.products||[]).find(x=>x.id===id);
const app=document.getElementById("app");
function money(v,c="EUR"){try{return new Intl.NumberFormat("de-DE",{style:"currency",currency:c}).format(v)}catch(e){return v+" €"}}
function label(k){return ({coffee:"Kaffee",milk:"Milch",variety:"Vielfalt",clean:"Reinigung",smart:"Smart",lumens:"Lumen",kelvinMin:"Kelvin min.",kelvinMax:"Kelvin max.",cri:"CRI",dimmable:"Dimmbar",lampType:"Lampentyp",areaMaxM2:"Fläche",navigation:"Navigation",obstacleAvoidance:"Hinderniserkennung",petHair:"Tierhaare",mopping:"Wischen",selfEmptying:"Absaugstation",mopWashing:"Moppreinigung",noiseDb:"Lautstärke"}[k]||k)}
if(!p){app.innerHTML='<section class="notfound"><span class="eyebrow">WohnPlanbar</span><h1>Produkt noch nicht verfügbar.</h1><p>Die Produktdetailseite ist vorbereitet. Konkrete Produkte erscheinen hier, sobald sie in der zentralen Produktdatenbank liegen.</p></section>'}
else{
 const offers=(p.offers||[]).filter(o=>o&&o.merchant&&o.deeplink&&Number.isFinite(Number(o.price))).sort((a,b)=>a.price-b.price);
 const facts=Object.entries(p.attributes||{}).filter(([,v])=>v!==null&&v!==undefined&&v!=="").slice(0,12);
 const image=p.images?.[0]||p.image||"";
 app.innerHTML='<div class="crumb"><a href="../index.html">WohnPlanbar</a> › '+esc(p.category||"Produkt")+' › '+esc(p.brand)+" "+esc(p.model)+'</div><main class="product"><div class="media">'+(image?'<img src="'+esc(image)+'" alt="'+esc(p.brand+" "+p.model)+'">':'<div class="placeholder"><b>'+esc((p.brand||"W").charAt(0))+'</b><strong>Produktbild folgt</strong><p>Wir verwenden hier später nur freigegebene Produktbilder aus Partnerfeeds oder mit entsprechender Nutzungsfreigabe.</p></div>')+'</div><div class="copy"><span class="eyebrow">'+esc(p.category||"Produkt")+'</span><h1>'+esc(p.brand)+" "+esc(p.model)+'</h1><div class="brandline">'+(p.sku?"Modell "+esc(p.sku):"WohnPlanbar Produkt")+'</div><p class="intro">'+esc(p.description||"Dieses Produkt ist in der zentralen WohnPlanbar-Datenstruktur angelegt. Finder-Merkmale und Händlerangebote werden hier zusammengeführt.")+'</p><section class="panel"><h2>Technische Daten</h2><div class="facts">'+(facts.length?facts.map(([k,v])=>'<div class="fact"><b>'+esc(label(k))+'</b><span>'+esc(v)+'</span></div>').join(""):'<div class="empty">Technische Produktdaten werden über den Produktfeed ergänzt.</div>')+'</div></section><section class="panel"><h2>Händler & Preise</h2><div class="offers">'+(offers.length?offers.map(o=>'<div class="offer"><div><strong>'+esc(o.merchant)+'</strong><small>'+esc(o.availability||"Verfügbarkeit laut Partnerfeed")+'</small></div><div class="price">'+money(Number(o.price),o.currency||"EUR")+'</div><a href="'+esc(o.deeplink)+'" target="_blank" rel="sponsored noopener">Zum Angebot</a></div>').join(""):'<div class="empty"><strong>Noch keine Live-Angebote verbunden.</strong><br>Sobald ein freigegebener Partnerfeed vorliegt, können hier mehrere Händlerangebote für dasselbe Produkt erscheinen.</div>')+'</div><div class="notice">Händlerangebote und Provisionen beeinflussen die Finder-Bewertung nicht. Preise und Verfügbarkeit werden erst als live bezeichnet, wenn sie tatsächlich aus einer angebundenen Quelle stammen.</div></section></div></main>'
}
</script></body></html>
