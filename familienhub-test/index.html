<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>FamilienHub Test</title>
<link rel="stylesheet" href="https://familienhub-marcel.vercel.app/style1.css?v=15.0">
<link rel="stylesheet" href="https://familienhub-marcel.vercel.app/style2.css?v=15.4">
<link rel="stylesheet" href="https://familienhub-marcel.vercel.app/style3.css?v=15.5">
<link rel="stylesheet" href="https://familienhub-marcel.vercel.app/style4.css?v=15.6">
<link rel="stylesheet" href="https://familienhub-marcel.vercel.app/style5.css?v=15.8.1">
<link rel="stylesheet" href="https://familienhub-marcel.vercel.app/style6.css?v=15.8.1">
<link rel="stylesheet" href="https://familienhub-marcel.vercel.app/meal-planner.css?v=15.3">
<link rel="stylesheet" href="https://familienhub-marcel.vercel.app/shopping-v159.css?v=15.9.1">
<style>
/* isolated test-only additions; production files above provide the real visual language */
.nav{z-index:900!important;pointer-events:auto!important;isolation:isolate;touch-action:manipulation}
.nav button{position:relative;z-index:2;min-height:58px;pointer-events:auto!important;touch-action:manipulation!important;-webkit-tap-highlight-color:transparent}
.nav button:after{content:none!important}
.overlay{z-index:1200!important}.toast{z-index:1300!important;pointer-events:none}
body.fh-shopping .m{padding-bottom:calc(108px + env(safe-area-inset-bottom))!important}
body:not(.today-view) #status{display:none!important}
button,a,label,input,select,textarea{touch-action:manipulation}
.testHint{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:#f3f6fa;color:#667085;font-size:11px;line-height:1.4}
.bootChoices{margin-top:14px}.bootChoices h3{margin:0 0 9px;font-size:14px}.bootChoiceGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.bootChoiceGrid button{border:1px solid #dfe5ec;background:#fff;border-radius:11px;min-height:40px;font-size:11px;font-weight:850;color:#5f6f83}.bootChoiceGrid button.on{background:#eef4ff;border-color:#bad0ff;color:#286fcf}
.fhBoot.fhBootFamily .fhBootMark{background:#e8f7ec;color:#248b45}.fhBoot.fhBootMinimal .fhBootMark{background:#fff;color:#111827;border:1px solid #e6e9ee}.fhBoot.fhBootPersonal .fhBootMark{background:#111827;color:#fff}
.fhBootSub{margin-top:7px;color:#7b8798;font-size:12px;font-weight:650;line-height:1.4}.fhBootTiny{margin-top:18px;font-size:10px;color:#98a2b3}
.pageCard{padding:9px 12px}.testTopNote{font-size:10px;color:#98a2b3;margin:2px 0 10px;text-align:center}
body.fh-shopping .fhShoppingHead,body.fh-shopping .fhShopTools,body.fh-shopping .fhRecipeTools{display:flex}.fhShopTools,.fhRecipeTools{display:block!important}
.fhFoodVisual.placeholder{display:grid;place-items:center}
.fhShoppingHead button,.fhOwnItem,.fhCategoryCard,.fhNewRecipe,.fhRecipeFilters button,.mpTabs button,.mpIconBtn,.mpAddMeal,.calendarDay,.calendarEvent,.todayFeature,.todayStat,.todayHeart{touch-action:manipulation}
@media(max-width:520px){.auth{margin-top:18px}.bootChoiceGrid button{font-size:10px;padding:4px}.members{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body class="fh-app-booting">
<div class="w">
<header class="top"><div><div><span class="ey">FamilienHub</span><span class="pill" id="status">Live</span></div><h1 id="ttl">FamilienHub</h1></div><button class="av" id="av">?</button></header>
<main class="m" id="main"></main>
<nav class="nav hide" id="nav">
<button data-v="today" class="on"><span class="navIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/></svg></span>Heute</button>
<button data-v="calendar"><span class="navIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span>Kalender</button>
<button data-v="tasks"><span class="navIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></span>Aufgaben</button>
<button data-v="shop"><span class="navIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 1.9-1.4L21 8H7"/></svg></span>Einkaufen</button>
<button data-v="family"><span class="navIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 21a7 7 0 0 1 14 0"/></svg></span>Familie</button>
</nav>
</div>
<div id="editorOverlay" class="overlay hide" aria-hidden="true"><section class="sheet" role="dialog" aria-modal="true"><div class="sheetHead"><div><div class="ey">Lokaler Test</div><h2 id="editorTitle">Eintrag</h2></div><button class="close" id="editorClose" type="button" aria-label="Schließen">×</button></div><form id="editorForm"><div class="field"><label>Bezeichnung</label><input id="editorInput" value="Testeintrag"></div><div class="actions"><button class="btn secondary" id="editorCancel" type="button">Abbrechen</button><button class="btn" type="submit">Speichern</button></div></form></section></div>
<div id="toast" class="toast hide"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const main=$('#main'),nav=$('#nav'),ttl=$('#ttl'),av=$('#av'),overlay=$('#editorOverlay'),toast=$('#toast');
let loggedIn=false,view='today',authKind='pin',bootMode=3,shopTab='list',toastTimer;
const calSvg='<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="8" y="11" width="32" height="28" rx="5"/><path d="M8 19h32M16 7v8M32 7v8"/></svg>';
const taskSvg='<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="16"/><path d="m16.5 24 5 5 10-11"/></svg>';
const shopSvg='<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 10h5l4 20h18l5-14H15"/><circle cx="20" cy="37" r="2"/><circle cx="34" cy="37" r="2"/></svg>';
const heartSvg='<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 38S8 29 8 18a8 8 0 0 1 14-5 8 8 0 0 1 2 3 8 8 0 0 1 2-3 8 8 0 0 1 14 5c0 11-16 20-16 20Z"/></svg>';
const checklistSvg='<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="15" y="12" width="35" height="43" rx="6"/><rect x="25" y="7" width="15" height="10" rx="4"/><path d="m22 28 4 4 7-8M22 39l4 4 7-8M37 28h7M37 39h7"/></svg>';
const basketSvg='<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M13 28h38l-4 25H17Z"/><path d="M21 28 27 16M43 28 37 16M20 37h24M23 37l2 11M32 37v11M41 37l-2 11"/><path d="M18 22h8v6h-8zM30 18h8v10h-8z"/></svg>';
function showToast(text='1 Tipp erkannt'){toast.textContent='✓ '+text;toast.classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.add('hide'),800)}
function cleanBody(){document.body.classList.remove('fh-app-booting','today-view','calendar-view','fh-shopping')}
function renderBoot(auto=true){cleanBody();document.body.classList.add('fh-app-booting');nav.classList.add('hide');ttl.textContent='FamilienHub';av.textContent='';const cfg={1:['fhBootFamily','♥','FamilienHub','Gemeinsam organisiert. Gemeinsam zuhause.'],2:['fhBootMinimal','FH','FamilienHub','Alles für eure Familie an einem Ort.'],3:['fhBootPersonal','M','Hallo, Marcel','Dein Familienalltag wird vorbereitet.']}[bootMode];main.innerHTML=`<section class="fhBoot ${cfg[0]}" aria-live="polite"><div class="fhBootMark">${cfg[1]}</div><div class="fhBootBrand">${cfg[2]}</div><div class="fhBootSub">${cfg[3]}</div><div class="fhBootStatus"><i></i><span>Sitzung wird geladen …</span></div><div class="fhBootTiny">Testumgebung · keine echten Daten</div></section>`;if(auto)setTimeout(()=>loggedIn?renderApp():renderAuth(),1100)}
function renderAuth(){cleanBody();nav.classList.add('hide');ttl.textContent='Anmelden';av.textContent='?';main.innerHTML=`<section class="auth"><div class="ey">FamilienHub Cloud</div><h2>Willkommen zurück</h2><div class="authKinds"><button type="button" data-auth-kind="pin" class="${authKind==='pin'?'on':''}">Benutzername + PIN</button><button type="button" data-auth-kind="mail" class="${authKind==='mail'?'on':''}">E-Mail</button></div><form id="testLogin">${authKind==='pin'?'<div class="field"><label>Benutzername</label><input name="user" value="Marcel" autocomplete="username" required></div><div class="field"><label>PIN</label><input name="pin" inputmode="numeric" type="password" value="2022" minlength="4" maxlength="8" required></div>':'<div class="field"><label>E-Mail</label><input name="mail" type="email" value="test@familienhub.local" required></div><div class="field"><label>Passwort</label><input name="pw" type="password" value="familienhub" required></div>'}<button class="btn">Anmelden</button></form><div class="authHint muted">Öffentliche Testumgebung: Anmeldung ist simuliert. Keine Firebase-Anmeldung und keine Familiendaten.</div><div class="bootChoices card"><h3>Ladebildschirm testen</h3><div class="bootChoiceGrid"><button type="button" data-boot="1" class="${bootMode===1?'on':''}">1 · Familie</button><button type="button" data-boot="2" class="${bootMode===2?'on':''}">2 · Minimal</button><button type="button" data-boot="3" class="${bootMode===3?'on':''}">3 · Persönlich</button></div></div></section>`}
function renderApp(){cleanBody();nav.classList.remove('hide');av.textContent='M';const names={today:'Heute',calendar:'Kalender',tasks:'Aufgaben',shop:'Einkaufen',family:'Familie'};ttl.textContent=names[view];$$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));if(view==='today')renderToday();if(view==='calendar')renderCalendar();if(view==='tasks')renderTasks();if(view==='shop')renderShop();if(view==='family')renderFamily()}
function renderToday(){document.body.classList.add('today-view');const now=new Date(),dateLabel=new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'2-digit',month:'long'}).format(now);main.innerHTML=`<div class="todayHome"><section class="todayHero"><div class="todayImageWrap"><img class="todayFamilyImage" src="https://familienhub-marcel.vercel.app/assets/familienhub-family-hero-v154.svg?v=15.4" alt="Familie vor ihrem Zuhause"><span class="todayLive"><i></i>Live</span></div><div class="todayGreetingCard"><div class="todayGreetingTop"><div><div class="todayKicker">Guten Tag</div><h2>Hallo, Marcel <span aria-hidden="true">👋</span></h2><p>${dateLabel}</p></div><button class="todayHeart" type="button" data-go="family">${heartSvg}</button></div><div class="todayStats"><button class="todayStat todayStatCalendar" data-go="calendar"><span><b>2</b><small>Termine</small></span><span class="todayStatIcon">${calSvg}</span></button><button class="todayStat todayStatTasks" data-go="tasks"><span><b>4</b><small>Aufgaben</small></span><span class="todayStatIcon">${taskSvg}</span></button><button class="todayStat todayStatShop" data-go="shop"><span><b>7</b><small>Einkäufe</small></span><span class="todayStatIcon">${shopSvg}</span></button></div></div></section><section class="todayFeatureList"><button class="todayFeature featureCalendar" data-go="calendar"><span class="todayFeatureArt">${calSvg}<i class="featureBadge">★</i></span><span class="todayFeatureText"><b>Termine</b><small>2 Termine heute.</small></span><span class="todayChevron">›</span></button><button class="todayFeature featureTasks" data-go="tasks"><span class="todayFeatureArt">${checklistSvg}<i class="featureBadge">✓</i></span><span class="todayFeatureText"><b>Aufgaben</b><small>4 Aufgaben offen.</small></span><span class="todayChevron">›</span></button><button class="todayFeature featureShop" data-go="shop"><span class="todayFeatureArt">${basketSvg}</span><span class="todayFeatureText"><b>Einkaufen</b><small>7 Einträge auf der Liste.</small></span><span class="todayChevron">›</span></button></section></div>`}
function renderCalendar(){document.body.classList.add('calendar-view');main.innerHTML=`<div class="calendarShell"><header class="calendarHeader"><div class="calendarTopbar"><button class="calendarArrow" type="button">‹</button><div class="calendarTopTitle"><small>Familienkalender</small><strong>August 2026</strong></div><div class="calendarTopActions"><button class="calendarTodayBtn" type="button">Heute</button><button class="calendarArrow" type="button">›</button></div></div><div class="calendarWeek"><button class="calendarDay"><span>Mo</span><b>17</b></button><button class="calendarDay"><span>Di</span><b>18</b></button><button class="calendarDay"><span>Mi</span><b>19</b></button><button class="calendarDay"><span>Do</span><b>20</b></button><button class="calendarDay selected today"><span>Fr</span><b>21</b></button><button class="calendarDay"><span>Sa</span><b>22</b></button><button class="calendarDay"><span>So</span><b>23</b></button></div><div class="calendarSelected"><b>Freitag, 21. August</b><span>2 Termine</span></div></header><div class="calendarBoardViewport"><div class="calendarBoard">${calendarColumn('♥','Familie','Gemeinsam',0,'<button class="calendarEvent tone2" data-editor="Termin"><b>Familienzeit</b><span>18:00 – 20:00</span><span class="eventPlace">Zuhause</span></button>')}${calendarColumn('M','Marcel','Erwachsener',1,'<button class="calendarEvent tone3" data-editor="Termin"><b>Termin</b><span>15:30 – 16:30</span></button>')}${calendarColumn('A','Mitglied','Erwachsener',2,'')}${calendarColumn('K','Kind','Kind',3,'')}</div></div><button class="fab" type="button" data-editor="Neuer Termin">+</button></div>`}
function calendarColumn(initial,name,role,tone,event){return `<section class="calendarColumn"><div class="calendarMemberHead"><span class="calendarAvatar tone${tone}">${initial}</span><span class="calendarMemberText"><b>${name}</b><small>${role}</small></span><button class="calendarColumnAdd" data-editor="Neuer Termin">+</button></div><div class="calendarEvents">${event||'<div class="calendarEmpty">Noch nichts geplant.<br>Tippe auf +</div>'}</div></section>`}
function renderTasks(){main.innerHTML=`<section class="card pageCard"><div class="item"><input type="checkbox" data-check><button class="itemMain grow" data-editor="Aufgabe bearbeiten"><span class="itemText"><span class="taskTitleLine"><b>Getränke einkaufen</b><span class="priority priority-high">Hoch</span></span><span class="meta"><span>Heute</span><span>Marcel</span></span></span><span class="chev">›</span></button></div><div class="item"><input type="checkbox" data-check><button class="itemMain grow" data-editor="Aufgabe bearbeiten"><span class="itemText"><span class="taskTitleLine"><b>Unterlagen prüfen</b><span class="priority priority-normal">Normal</span></span><span class="meta"><span>Morgen</span></span></span><span class="chev">›</span></button></div><div class="item"><input type="checkbox" data-check><button class="itemMain grow" data-editor="Aufgabe bearbeiten"><span class="itemText"><span class="taskTitleLine"><b>Wäsche</b><span class="priority priority-low">Niedrig</span></span><span class="meta"><span>Samstag</span></span></span><span class="chev">›</span></button></div></section><button class="fab" data-editor="Neue Aufgabe">+</button>`}
function renderFamily(){main.innerHTML=`<section class="hero"><div class="ey" style="color:#94a3b8">Familie</div><h2>Familie</h2><p>Testansicht ohne Firebase-Verbindung.</p></section><section class="card"><h3>Einladungscode</h3><div class="code">TEST-ONLY</div><p class="muted">In dieser öffentlichen Testversion nicht verwendbar.</p></section><h2 class="title">Mitglieder</h2><div class="members"><div class="member"><div class="bubble">M</div><b>Marcel</b><br><small class="muted">Administrator</small></div><div class="member"><div class="bubble">A</div><b>Mitglied</b><br><small class="muted">Erwachsener</small></div><div class="member"><div class="bubble">K</div><b>Kind</b><br><small class="muted">Kind</small></div></div><button class="btn secondary" style="margin-top:14px" data-logout>Abmelden</button>`}
function renderShop(){document.body.classList.add('fh-shopping');main.innerHTML=`<div class="mpRoot" data-shop-tab="${shopTab}"><header class="fhShoppingHead"><h1>Einkaufen</h1><button type="button" data-shop-add aria-label="Hinzufügen">+</button></header><div class="mpTabs"><button data-shop-tab="list" class="${shopTab==='list'?'on':''}">Einkaufsliste</button><button data-shop-tab="plan" class="${shopTab==='plan'?'on':''}">Essensplan</button><button data-shop-tab="recipes" class="${shopTab==='recipes'?'on':''}">Gerichte</button></div>${shopTab==='list'?shopListHtml():shopTab==='plan'?shopPlanHtml():shopRecipesHtml()}</div>`}
function shopListHtml(){return `<section class="fhShopTools"><div class="fhShopSearch"><span>⌕</span><input id="shopSearch" type="search" placeholder="Artikel suchen …"><button type="button" class="fhOwnItem" data-editor="Eigener Artikel">Eigener Artikel <b>＋</b></button></div><div class="fhCategoryCards"><button class="fhCategoryCard catGreen"><span>🍏</span><b>Obst & Gemüse</b><small>2</small></button><button class="fhCategoryCard catBlue"><span>❄️</span><b>Kühlung</b><small>2</small></button><button class="fhCategoryCard catPurple"><span>🧃</span><b>Getränke</b><small>1</small></button></div><div class="fhShopListHead"><b>Alle Artikel</b><span>A–Z</span></div></section><section class="mpGroup card" data-shop-group><div class="mpGroupHead"><h3><span class="fhGroupIcon catGreen">🍏</span>Obst & Gemüse</h3><span>2</span></div>${shopRow('Tomaten','1 Packung')}${shopRow('Gurke','1 Stück')}</section><section class="mpGroup card" data-shop-group><div class="mpGroupHead"><h3><span class="fhGroupIcon catBlue">❄️</span>Kühlung</h3><span>2</span></div>${shopRow('Milch','2 × 1 l')}${shopRow('Joghurt','4 Becher')}</section><section class="mpGroup card" data-shop-group><div class="mpGroupHead"><h3><span class="fhGroupIcon catPurple">🧃</span>Getränke</h3><span>1</span></div>${shopRow('Mineralwasser','1 Kiste')}</section>`}
function shopRow(name,qty){return `<div class="mpShopRow"><label class="mpCheck"><input type="checkbox" data-shop-check><span></span></label><button class="mpShopMain" data-editor="Artikel bearbeiten"><b>${name}</b><small>${qty}</small></button><button class="mpIconBtn" data-editor="Artikel bearbeiten">›</button></div>`}
function shopPlanHtml(){return `<div class="mpWeekHead"><button class="mpIconBtn">‹</button><div><div class="ey">Essensplan</div><h2>17.–23. August</h2></div><button class="mpIconBtn">›</button></div><div class="mpWeekActions"><button class="btn secondary" data-editor="Gericht auswählen">Gericht wählen</button><button class="btn" data-editor="Essen planen">＋ Planen</button></div><div class="mpPlanList"><section class="mpDay card today"><div class="mpDayTitle"><div><b>Freitag</b><span>Heute</span></div></div><div class="mpSlot"><span>Abendessen</span><div class="mpPlanned"><button class="mpMealName" data-editor="Gericht bearbeiten"><span class="fhFoodVisual placeholder">🍝</span><b>Pasta mit Tomaten</b><small>Geplant</small></button><button class="mpRemove">×</button></div></div></section><section class="mpDay card"><div class="mpDayTitle"><div><b>Samstag</b></div></div><div class="mpSlot"><span>Abendessen</span><button class="mpAddMeal" data-editor="Essen planen">＋ Gericht einplanen</button></div></section><section class="mpDay card"><div class="mpDayTitle"><div><b>Sonntag</b></div></div><div class="mpSlot"><span>Mittagessen</span><button class="mpAddMeal" data-editor="Essen planen">＋ Gericht einplanen</button></div></section></div>`}
function shopRecipesHtml(){return `<section class="fhRecipeTools"><div class="fhRecipeSearch"><span>⌕</span><input type="search" placeholder="Gericht suchen …"><button type="button" class="fhNewRecipe" data-editor="Neues Gericht">＋ Gericht</button></div><div class="fhRecipeFilters"><button class="on">Alle</button><button>♡ Häufig gekocht</button></div></section><div class="mpRecipeGrid"><article class="mpRecipe card"><div class="fhRecipeHero"><span class="fhFoodVisual large placeholder">🍝</span></div><div class="mpRecipeTop"><div><span class="mpBadge">Favorit</span><h3>Pasta mit Tomaten</h3><p>Einfach & schnell</p></div><button class="mpIconBtn" data-editor="Gericht bearbeiten">⋯</button></div><div class="mpIngredientsPreview"><span>Nudeln</span><span>Tomaten</span><span>Parmesan</span></div><button class="btn secondary" data-editor="Zum Plan">Zum Plan</button></article><article class="mpRecipe card"><div class="fhRecipeHero"><span class="fhFoodVisual large placeholder">🍕</span></div><div class="mpRecipeTop"><div><h3>Pizza</h3><p>Familiengericht</p></div><button class="mpIconBtn" data-editor="Gericht bearbeiten">⋯</button></div><div class="mpIngredientsPreview"><span>Teig</span><span>Tomaten</span><span>Käse</span></div><button class="btn secondary" data-editor="Zum Plan">Zum Plan</button></article></div>`}
function openEditor(title){$('#editorTitle').textContent=title||'Eintrag';overlay.classList.remove('hide');overlay.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';showToast('Öffnen: 1 Tipp')}
function closeEditor(){if(overlay.classList.contains('hide'))return;overlay.classList.add('hide');overlay.setAttribute('aria-hidden','true');document.body.style.overflow='';showToast('Schließen: 1 Tipp')}
main.addEventListener('click',e=>{const auth=e.target.closest('[data-auth-kind]');if(auth){authKind=auth.dataset.authKind;renderAuth();showToast();return}const boot=e.target.closest('[data-boot]');if(boot){bootMode=Number(boot.dataset.boot);renderBoot(false);setTimeout(renderAuth,1250);return}const go=e.target.closest('[data-go]');if(go){view=go.dataset.go;renderApp();showToast('Navigation: 1 Tipp');return}const shop=e.target.closest('[data-shop-tab]');if(shop){shopTab=shop.dataset.shopTab;renderShop();showToast('Reiter: 1 Tipp');return}const edit=e.target.closest('[data-editor],[data-shop-add]');if(edit){openEditor(edit.dataset.editor||'Hinzufügen');return}if(e.target.closest('[data-logout]')){loggedIn=false;view='today';renderAuth();showToast('Abmeldung: 1 Tipp')}});
main.addEventListener('submit',e=>{if(e.target.id!=='testLogin')return;e.preventDefault();const b=e.submitter;b.disabled=true;b.textContent='Wird angemeldet …';setTimeout(()=>{loggedIn=true;view='today';b.disabled=false;b.textContent='Anmelden';renderBoot(true)},450)});
main.addEventListener('change',e=>{if(e.target.matches('[data-shop-check]')){e.target.closest('.mpShopRow')?.classList.toggle('fhChecked',e.target.checked);showToast('Checkbox: 1 Tipp')}if(e.target.matches('[data-check]')){e.target.closest('.item')?.classList.toggle('done',e.target.checked);showToast('Aufgabe: 1 Tipp')}});
nav.addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(!b||!loggedIn)return;view=b.dataset.v;renderApp();showToast('Navigation: 1 Tipp')});
$('#editorClose').addEventListener('click',closeEditor);$('#editorCancel').addEventListener('click',closeEditor);overlay.addEventListener('click',e=>{if(e.target===overlay)closeEditor()});$('#editorForm').addEventListener('submit',e=>{e.preventDefault();closeEditor();setTimeout(()=>showToast('Speichern: 1 Tipp'),50)});
renderBoot(true);
</script>
</body>
</html>
